name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Tests Python (moteur de corroboration)
        run: |
          pip install -r requirements.txt
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm install (et non npm ci) : le package-lock vient de Windows, des dépendances natives Linux peuvent y manquer
      - run: npm install --no-audit --no-fund
      - name: Tests JS (relais, réponses pré-enregistrées)
        run: npm test
      - name: Build du site statique
        run: npm run build
        env:
          VITE_CHAT_URL: ${{ vars.CHAT_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
